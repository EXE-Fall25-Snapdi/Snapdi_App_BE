version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: snapdi-postgres
    environment:
      POSTGRES_DB: snapdi_db
      POSTGRES_USER: snapdi_user
      POSTGRES_PASSWORD: snapdi_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapdi_user -d snapdi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Snapdi API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapdi-api
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      CONNECTION_STRING: "Host=postgres;Port=5432;Database=snapdi_db;Username=snapdi_user;Password=snapdi_password_123;Include Error Detail=true"
      
      # JWT Configuration
      JWT_KEY: "your-super-secret-jwt-key-minimum-32-characters-long-for-security"
      JWT_ISSUER: "SnapdiAPI"
      JWT_AUDIENCE: "SnapdiClient"
      JWT_EXPIRATION_HOURS: "24"
      
      # App Configuration
      APP_BASE_URL: "http://localhost:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
